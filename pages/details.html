<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- Product Details CSS -->
    <link rel="stylesheet" href="../css/details.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Boxicons -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Product Details - TechnoHub</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="nav">
      <div class="logo">Techno<span>Hub</span></div>

      <ul class="links">
        <li><a class="link" href="../index.html">Home</a></li>
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link" href="../index.categories">Categories</a></li>
        <li><a class="link" href="../index.about">About</a></li>
        <li><a class="link" href="../index.contact">Contact</a></li>
      </ul>

      <div class="nav-icons">

        <i class="bx bx-heart-circle wishlist-icon"></i>

        <div class="cart-wrapper">
          <a href="cart.html"><i class="bx bx-cart-download cart-icon"></i></a>
          <span class="cart-count">0</span>
        </div>

        <i class="bx bx-menu menu-icon"></i>
        <a href="login.html" class="log-in">Log In</a>
      </div>
    </nav>

    <!-- Product Details -->
    <main class="product-details-section">
      <div class="product-details-container">
        <div class="product-image-container">
          <img class="product-details-image" src="" alt="" />
        </div>

        <div class="product-details-info">
          <span class="product-category"></span>

          <h1 class="product-name"></h1>

          <div class="product-rating">
            <span class="stars-number"></span>
          </div>
          <h2 class="description-title">Product Description :</h2>
          <p class="product-description"></p>

          <span class="product-price"></span>

          <div class="product-actions">
            <button class="details-add-cart-btn">
              Add To Cart <i class="bx bx-cart-download"></i>
            </button>
            <button class="back-btn" onclick="history.back()">
              <i class="bx bx-arrow-back"></i>
              Back To Products
            </button>
          </div>
        </div>
      </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/details.js"></script>
  </body>
</html>
