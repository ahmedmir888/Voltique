<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Main CSS -->
    <link rel="stylesheet" href="../css/style.css" />

    <!-- Product Details CSS -->
    <link rel="stylesheet" href="../css/details.css" />

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <!-- Boxicons -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Product Details - TechnoHub</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="nav">
      <div class="logo" dir="ltr">
        <img src="../imgs/Voltique-logo.png" alt="" />Volti<span>que</span>
      </div>
      <ul class="links">
        <li><a class="link" href="../index.html" data-i18n="home">Home</a></li>
        <li>
          <a class="link" href="products.html" data-i18n="products">Products</a>
        </li>
        <li>
          <a class="link" href="categories.html" data-i18n="categories"
            >Categories</a
          >
        </li>
        <li>
          <a class="link" href="about.html" data-i18n="about">About</a>
        </li>
        <li>
          <a class="link" href="contact.html" data-i18n="contact">Contact</a>
        </li>
      </ul>
      <div class="nav-icons">
        <button type="button" class="language-toggle" id="language-toggle">
          AR
        </button>
        <a href="wishlist.html" class="favorite-link">
          <i class="bx bx-heart-circle wishlist-icon"></i>
        </a>
        <a href="cart.html" class="cart-wrapper">
          <i class="bx bx-cart-download cart-icon"></i>
          <span class="cart-count">0</span>
        </a>
        <i class="bx bx-menu menu-icon"></i>
        <a href="login.html" class="log-in" data-i18n="login">Log In</a>
      </div>
    </nav>

    <!-- Product Details -->
    <main class="product-details-section">
      <div class="product-details-container">
        <div class="product-image-container">
          <img class="product-details-image" src="" alt="" />
        </div>

        <div class="product-details-info">
          <span class="product-category"></span>

          <h1 class="product-name"></h1>
          <h2 class="description-title" data-i18n="productDescriptionTitle">
            Product Description :
          </h2>
          <div class="product-description"></div>

          <span class="product-price"></span>

          <div class="product-actions">
            <button class="details-add-cart-btn">
              <span data-i18n="addToCart">Add To Cart</span>
              <i class="bx bx-cart-download"></i>
            </button>
          </div>
        </div>
      </div>
      <button class="back-btn" onclick="history.back()">
        <i class="bx bx-arrow-back"></i>
      </button>
      <div class="toasted-container"></div>
    </main>

    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/details.js"></script>
  </body>
</html>
