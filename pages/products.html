<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css Main File  -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Css Products file  -->
    <link rel="stylesheet" href="../css/products.css" />
    <!-- Google fonts link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Box Icons link  -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>TechnoHub</title>
  </head>
  <body>
    <nav class="nav">
      <div class="logo">Techno<span>Hub</span></div>
      <ul class="links">
        <li><a class="link" href="../index.html">Home</a></li>
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link" href="../index.categories">Categories</a></li>
        <li><a class="link" href="../index.about">About</a></li>
        <li><a class="link" href="../index.contact">Contact</a></li>
      </ul>
      <div class="nav-icons">
        <div class="search-box">
          <input type="text" name="search-input" placeholder="Search..." />
          <i class="bx bx-search search-btn"></i>
        </div>
        <i class="bx bx-heart-circle wishlist-icon"></i>
        <a href="cart.html" class="cart-wrapper">
          <i class="bx bx-cart-download cart-icon"></i>
          <span class="cart-count">0</span>
        </a>
        <i class="bx bx-menu menu-icon"></i>
      </div>
    </nav>
    <section class="page-header">
      <div class="container">
        <h1>OUR PRODUCTS</h1>
        <p>Discover the latest electrical and electronic devices.</p>
      </div>
    </section>
    <section class="products-controls">
      <div class="container">
        <div class="search-products">
          <input type="search" placeholder="Search products..." />
          <i class="bx bx-search"></i>
        </div>

        <div class="filter-products">
          <select>
            <option value="all">All Categories</option>
            <option value="smartphones">Smartphones</option>
            <option value="laptops">Laptops</option>
            <option value="televisions">Televisions</option>
            <option value="audio">Audio</option>
            <option value="cameras">Cameras</option>
            <option value="gaming">Gaming</option>
            <option value="appliances">Home Appliances</option>
            <option value="accessories">Accessories</option>
          </select>
        </div>

        <div class="price-filter">
          <input type="number" placeholder="Min Price" min="0" />

          <input type="number" placeholder="Max Price" min="0" />

          <button type="button">Apply</button>
        </div>

        <div class="sort-products">
          <select>
            <option value="default">Sort By</option>
            <option value="price-low">Price: Low to High</option>
            <option value="price-high">Price: High to Low</option>
            <option value="name-az">Name: A to Z</option>
            <option value="name-za">Name: Z to A</option>
            <option value="rating">Rating</option>
          </select>
        </div>
      </div>
    </section>
    <section class="products-section">
      <div class="container">
        <div class="products-grid"></div>
      </div>
    </section>
    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/products.js"></script>
  </body>
</html>
