<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css Main File  -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- Css Products file  -->
    <link rel="stylesheet" href="../css/products.css" />
    <!-- Google fonts link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Box Icons link  -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>Voltique</title>
  </head>
  <body>
    <nav class="nav">
      <div class="logo" dir="ltr">
        <img src="../imgs/Voltique-logo.png" alt="" />Volti<span>que</span>
      </div>
      <ul class="links">
        <li><a class="link" href="../index.html" data-i18n="home">Home</a></li>
        <li>
          <a class="link" href="products.html" data-i18n="products">Products</a>
        </li>
        <li>
          <a class="link" href="categories.html" data-i18n="categories"
            >Categories</a
          >
        </li>
        <li>
          <a class="link" href="about.html" data-i18n="about">About</a>
        </li>
        <li>
          <a class="link" href="contact.html" data-i18n="contact">Contact</a>
        </li>
      </ul>
      <div class="nav-icons">
        <button type="button" class="language-toggle" id="language-toggle">
          AR
        </button>
        <a href="wishlist.html" class="favorite-link">
          <i class="bx bx-heart-circle wishlist-icon"></i>
        </a>
        <a href="cart.html" class="cart-wrapper">
          <i class="bx bx-cart-download cart-icon"></i>
          <span class="cart-count">0</span>
        </a>
        <i class="bx bx-menu menu-icon"></i>
        <a href="login.html" class="log-in" data-i18n="login">Log In</a>
      </div>
    </nav>
    <section class="page-header">
      <div class="container">
        <h1 data-i18n="productsTitle">OUR PRODUCTS</h1>
        <p data-i18n="productsDescription">Discover the latest electrical and electronic devices.</p>
      </div>
    </section>
    <section class="products-controls">
      <div class="container">
        <div class="search-products">
          <input
            class="search-products-input"
            type="text"
            placeholder="Search products..."
            data-i18n-Placeholder="searchProducts"
          />
          <i class="bx bx-search search-products-icon"></i>
        </div>

        <div class="filter-products">
          <select class="select-category-options">
            <option value="all" data-i18n="allCategories">All Categories</option>
            <option value="smartphone" data-i18n="smartphones">Smartphones</option>
            <option value="laptop" data-i18n="laptops">Laptops</option>
            <option value="gaming" data-i18n="gaming">Gaming</option>
            <option value="television"  data-i18n="televisions">Televisions</option>
            <option value="audio" data-i18n="audio">Audio</option>
            <option value="accessories" data-i18n="accessories">Accessories</option>
          </select>
        </div>

        <div class="sort-products">
          <select class="select-product-sort">
            <option value="default" data-i18n="sortBy">Sort By</option>
            <option value="price-low" data-i18n="priceLowHigh">Price: Low to High</option>
            <option value="price-high" data-i18n="priceHighLow">Price: High to Low</option>
            <option value="name-az" data-i18n="nameAZ">Name: A to Z</option>
            <option value="name-za" data-i18n="nameZA">Name: Z to A</option>
          </select>
        </div>
      </div>
    </section>
    <section class="products-section">
      <div class="container">
        <div class="products-grid"></div>
      </div>
    </section>
    <div class="toasted-container"></div>
    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/products.js"></script>
  </body>
</html>
