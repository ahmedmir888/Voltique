<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- Css Main File  -->
    <link rel="stylesheet" href="../css/style.css" />
    <!-- login Css File  -->
    <link rel="stylesheet" href="../css/login.css" />
    <!-- Google fonts link  -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />
    <!-- Box Icons link  -->
    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />
    <title>TechnoHub</title>
  </head>
  <body>
    <nav class="nav">
      <div class="logo">
        <img src="../imgs/Voltique-logo.png" alt="" />Vol<span>tique</span>
      </div>
      <ul class="links">
        <li><a class="link" href="../index.html">Home</a></li>
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link" href="categories.html">Categories</a></li>
        <li><a class="link" href="about.html">About</a></li>
        <li><a class="link" href="contact.html">Contact</a></li>
      </ul>
      <div class="nav-icons">
        <a href="wishlist.html" class="favorite-link">
          <i class="bx bx-heart-circle wishlist-icon"></i>
        </a>
        <a href="cart.html" class="cart-wrapper">
          <i class="bx bx-cart-download cart-icon"></i>
          <span class="cart-count">0</span>
        </a>
        <i class="bx bx-menu menu-icon"></i>
        <a href="login.html" class="log-in">Log In</a>
      </div>
    </nav>
    <div class="main-container">
      <div class="login-container">
        <div class="form-section">
          <!-- Login Form  -->
          <div class="form-container" id="loginForm">
            <h1 class="form-title">Welcome Back</h1>
            <p class="form-subtitle">
              Sign in to your account to continue your journey
            </p>

            <form action="" id="loginFormSubmit">
              <div class="form-group">
                <input
                  type="email"
                  class="form-control"
                  placeholder="Email Address"
                  required
                />
                <i class="bx bxs-envelope"></i>
              </div>
              <div class="form-group">
                <input
                  type="password"
                  class="form-control"
                  placeholder="Password"
                  required
                />
                <i class="bx bx-key"></i>
              </div>
              <div class="forgot-password">
                <a href="#">Forgot Password ?</a>
              </div>
              <button type="submit" class="btn-primery">
                <span class="btn-text">Sign Up</span>
              </button>
            </form>
            <div class="social-login">
              <div class="social-title">Or Continue With</div>
              <div class="social-buttons">
                <div class="social-btn google">
                  <i class="bx bxl-google"></i>
                </div>
                <div class="social-btn facebook">
                  <i class="bx bxl-facebook"></i>
                </div>
                <div class="social-btn twitter">
                  <i class="bx bxl-twitter"></i>
                </div>
              </div>
            </div>
            <div class="form-switch">
              Don't have an account? <a href="#">Create one</a>
            </div>
          </div>
        </div>
        <div class="image-section">
          <div class="floating-shapes">
            <div class="image-content">
              <h2>Hello, Friend</h2>
              <p>
                Enter your personal details and start your journey with us today
              </p>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script src="../js/main.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
