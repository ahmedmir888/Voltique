<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/checkout.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Checkout - TechnoHub</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="nav">
      <div class="logo">Techno<span>Hub</span></div>

      <ul class="links">
        <li><a class="link" href="../index.html">Home</a></li>
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link" href="categories.html">Categories</a></li>
        <li><a class="link" href="about.html">About</a></li>
        <li><a class="link" href="contact.html">Contact</a></li>
      </ul>

      <div class="nav-icons">
        <a href="favorite.html" class="favorite-link">
          <i class="bx bx-heart-circle wishlist-icon"></i>
        </a>

        <div class="cart-wrapper">
          <a href="cart.html">
            <i class="bx bx-cart-download cart-icon"></i>
          </a>
          <span class="cart-count">0</span>
        </div>

        <i class="bx bx-menu menu-icon"></i>
        <a href="login.html" class="log-in">Log In</a>
      </div>
    </nav>

    <!-- Checkout -->
    <main class="checkout-section">
      <div class="container">
        <h1 class="main-title">Checkout & Order Placement</h1>
        <p class="main-paragraph">
          Please enter you shipping information and choose a payment method
        </p>

        <div class="checkout-container">
          <!-- Customer Information -->
          <section class="checkout-form-section">
            <h2>1.Shipping Information</h2>

            <form id="checkout-form">
              <div class="form-group">
                <div class="group-coloumn">
                  <label for="full-name">Full Name:</label>
                  <input
                    type="text"
                    id="full-name"
                    name="full-name"
                    placeholder="user name"
                    required
                  />
                </div>
                <div class="group-coloumn">
                  <label for="email">Email:</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="user@gmial.com"
                    required
                  />
                </div>
              </div>
              <div class="form-group">
                <div class="group-coloumn">
                  <label for="country">Country:</label>
                  <input
                    type="text"
                    id="country"
                    name="country"
                    placeholder="Syria"
                    required
                  />
                </div>
                <div class="group-coloumn">
                  <label for="address">Address:</label>
                  <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="AL-Hasakah"
                    required
                  />
                </div>
              </div>

              <div class="form-row">
                <label for="phone">Phone Number:</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="+963 --- --- ---"
                  required
                />
                <label for="postal-code">Postal / ZIP Code:</label>
                <input
                  type="text"
                  id="postal-code"
                  name="postal-code"
                  placeholder="s.y. -----"
                  required
                />
              </div>

              <h2>2.Payment Method</h2>

              <div class="payment-method">
                <label>
                  <input type="radio" name="payment" value="cash" required />
                  <i class="bx bx-money cash-money"></i>
                  <span>Cash on Delivery</span>
                </label>

                <label>
                  <input type="radio" name="payment" value="card" />
                  <i class="bx bx-credit-card credit-card"></i>
                  <span>Credit / Debit Card</span>
                </label>
              </div>

              <button type="submit" class="place-order-btn">
                Place Order <i class="bx bxs-check-square"></i>
              </button>
            </form>
          </section>

          <!-- Order Summary -->
          <aside class="checkout-summary">
            <h2>Your Order</h2>

            <div class="checkout-items"></div>

            <div class="checkout-total">
              <span>Grand Total :</span>
              <strong class="checkout-total-price">$0</strong>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
