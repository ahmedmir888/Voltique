<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link rel="stylesheet" href="../css/style.css" />
    <link rel="stylesheet" href="../css/checkout.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Checkout - TechnoHub</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="nav">
      <div class="logo">Techno<span>Hub</span></div>

      <ul class="links">
        <li><a class="link" href="../index.html">Home</a></li>
        <li><a class="link" href="products.html">Products</a></li>
        <li><a class="link" href="../index.categories">Categories</a></li>
        <li><a class="link" href="../index.about">About</a></li>
        <li><a class="link" href="../index.contact">Contact</a></li>
      </ul>

      <div class="nav-icons">
        <div class="search-box">
          <input type="text" name="search-input" placeholder="Search..." />
          <i class="bx bx-search search-btn"></i>
        </div>

        <i class="bx bx-heart-circle wishlist-icon"></i>

        <div class="cart-wrapper">
          <a href="cart.html">
            <i class="bx bx-cart-download cart-icon"></i>
          </a>

          <span class="cart-count">0</span>
        </div>

        <i class="bx bx-menu menu-icon"></i>
      </div>
    </nav>

    <!-- Checkout -->
    <main class="checkout-section">
      <div class="container">
        <h1 class="main-title">Checkout</h1>

        <div class="checkout-container">
          <!-- Customer Information -->
          <section class="checkout-form-section">
            <h2>Shipping Information</h2>

            <form id="checkout-form">
              <div class="form-group">
                <label for="full-name">Full Name</label>
                <input type="text" id="full-name" name="full-name" required />
              </div>

              <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required />
              </div>

              <div class="form-group">
                <label for="phone">Phone Number</label>
                <input type="tel" id="phone" name="phone" required />
              </div>

              <div class="form-group">
                <label for="address">Address</label>
                <input type="text" id="address" name="address" required />
              </div>

              <div class="form-row">
                <div class="form-group">
                  <label for="city">City</label>
                  <input type="text" id="city" name="city" required />
                </div>

                <div class="form-group">
                  <label for="postal-code">Postal Code</label>
                  <input
                    type="text"
                    id="postal-code"
                    name="postal-code"
                    required
                  />
                </div>
              </div>

              <h2>Payment Method</h2>

              <div class="payment-method">
                <label>
                  <input type="radio" name="payment" value="cash" required />
                  Cash on Delivery
                </label>

                <label>
                  <input type="radio" name="payment" value="card" />
                  Credit / Debit Card
                </label>
              </div>

              <button type="submit" class="place-order-btn">Place Order</button>
            </form>
          </section>

          <!-- Order Summary -->
          <aside class="checkout-summary">
            <h2>Order Summary</h2>

            <div class="checkout-items"></div>

            <div class="checkout-total">
              <span>Total:</span>
              <strong class="checkout-total-price">$0</strong>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
