    <meta charset="UTF-8" />

    <link rel="stylesheet" href="../css/checkout.css" />

    <link
      href="https://fonts.googleapis.com/css2?family=Tajawal:wght@200;300;400;500;700;800;900&display=swap"
      rel="stylesheet"
    />

    <link
      href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
      rel="stylesheet"
    />

    <title>Voltique</title>
  </head>

  <body>
    <!-- Navbar -->
    <nav class="nav">
      <div class="logo" dir="ltr">
        <img src="../imgs/Voltique-logo.png" alt="" />Volti<span>que</span>
      </div>
      <ul class="links">
        <li><a class="link" href="../index.html" data-i18n="home">Home</a></li>
        <li>
          <a class="link" href="products.html" data-i18n="products">Products</a>
        </li>
        <li>
          <a class="link" href="categories.html" data-i18n="categories"
            >Categories</a
          >
        </li>
        <li>
          <a class="link" href="about.html" data-i18n="about">About</a>
        </li>
        <li>
          <a class="link" href="contact.html" data-i18n="contact">Contact</a>
        </li>
      </ul>
      <div class="nav-icons">
        <button type="button" class="language-toggle" id="language-toggle">
          AR
        </button>
        <a href="wishlist.html" class="favorite-link">
          <i class="bx bx-heart-circle wishlist-icon"></i>
        </a>
        <a href="cart.html" class="cart-wrapper">
          <i class="bx bx-cart-download cart-icon"></i>
          <span class="cart-count">0</span>
        </a>
        <i class="bx bx-menu menu-icon"></i>
        <a href="login.html" class="log-in" data-i18n="login">Log In</a>
      </div>
    </nav>

    <!-- Checkout -->

    <!-- Checkout -->
    <main class="checkout-section">
      <div class="container">
        <h1 class="main-title" data-i18n="checkoutTitle">
          Checkout & Order Placement
        </h1>
        <p class="main-paragraph" data-i18n="checkoutDescription">
          Please enter your shipping information and choose a payment method
        </p>

        <div class="checkout-container">
          <!-- Customer Information -->
          <section class="checkout-form-section">
            <h2 data-i18n="shippingInformation">1. Shipping Information</h2>

            <form action="\" id="checkout-form">
              <div class="form-group">
                <div class="group-coloumn">
                  <label for="full-name" data-i18n="fullName">Full Name:</label>
                  <input
                    type="text"
                    id="full-name"
                    name="full-name"
                    placeholder="User name"
                    data-i18n-placeholder="userNamePlaceholder"
                    required
                  />
                </div>
                <div class="group-coloumn">
                  <label for="email" data-i18n="email">Email:</label>
                  <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="user@gmail.com"
                    data-i18n-placeholder="emailPlaceholder"
                    required
                  />
                </div>
              </div>

              <div class="form-group">
                <div class="group-coloumn">
                  <label for="country" data-i18n="country">Country:</label>
                  <input
                    type="text"
                    id="country"
                    name="country"
                    placeholder="Syria"
                    data-i18n-placeholder="countryPlaceholder"
                    required
                  />
                </div>
                <div class="group-coloumn">
                  <label for="address" data-i18n="address">Address:</label>
                  <input
                    type="text"
                    id="address"
                    name="address"
                    placeholder="Al-Hasakah"
                    data-i18n-placeholder="addressPlaceholder"
                    required
                  />
                </div>
              </div>

              <div class="form-row">
                <label for="phone" data-i18n="phoneNumber">Phone Number:</label>
                <input
                  type="tel"
                  id="phone"
                  name="phone"
                  placeholder="+963 --- --- ---"
                  data-i18n-placeholder="phonePlaceholder"
                  required
                />

                <label for="postal-code" data-i18n="postalCode">
                  Postal / ZIP Code:
                </label>
                <input
                  type="text"
                  id="postal-code"
                  name="postal-code"
                  placeholder="S.Y. -----"
                  data-i18n-placeholder="postalCodePlaceholder"
                  required
                />
              </div>

              <h2 data-i18n="paymentMethod">2. Payment Method</h2>

              <div class="payment-method">
                <label>
                  <input type="radio" name="payment" value="cash" required />
                  <i class="bx bx-money cash-money"></i>
                  <span data-i18n="cashOnDelivery">Cash on Delivery</span>
                </label>

                <label>
                  <input type="radio" name="payment" value="card" />
                  <i class="bx bx-credit-card credit-card"></i>
                  <span data-i18n="creditDebitCard">Credit / Debit Card</span>
                </label>
              </div>

              <button type="submit" class="place-order-btn">
                <span data-i18n="placeOrder">Place Order</span>
                <i class="bx bxs-check-square"></i>
              </button>
            </form>
          </section>

          <!-- Order Summary -->
          <aside class="checkout-summary">
            <h2 data-i18n="yourOrder">Your Order</h2>

            <div class="checkout-items"></div>

            <div class="checkout-total">
              <span data-i18n="grandTotal">Grand Total:</span>
              <strong class="checkout-total-price">$0</strong>
            </div>
          </aside>
        </div>
      </div>
    </main>

    <script src="../js/translations.js"></script>
    <script src="../js/main.js"></script>
    <script src="../js/product-data.js"></script>
    <script src="../js/checkout.js"></script>
  </body>
</html>
